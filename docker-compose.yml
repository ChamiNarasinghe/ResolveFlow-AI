
services:
  postgres:
    image: postgres:17
    container_name: resolveflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resolveflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-resolveflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - resolveflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-resolveflow_user} -d ${POSTGRES_DB:-resolveflow_db}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  resolveflow_postgres_data:
